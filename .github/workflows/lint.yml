# What is the goal of your workflow
# Goal: Whenever someone changes the python code, 
# the linter will check if the sytax, format, indentation (Linting) is correct or not
name: Auto Linter

on:
  push:
    paths: "*.py"                  # .py wali file se kuch push hua h to hi trigger hogi

jobs:
  code-linting:                    # job ka name 
    runs-on: ubuntu-latest         # github free runner

    steps:
      # this step will automatically clone the code of the current branch into the runner
      - name: Checkout/Clone the code
        uses: actions/checkout@v7         # clone code to ubuntu runner - github action ka prebuild function h   
      # this step will install python
      - name: Set up Python
        uses: actions/setup-python@v5       # python install on runner - github action ka prebuild function h
        with:
          python-version: '3.14'            # python version
      # this step will install the linting tool 
      - name: Install Linter                # install linter for python code ka format check 
        run: pip install ruff
      # this step will run the linter
      - name: Check the files for linting      
        run: ruff check .                    # success pr 0  error pr 1 return krta h
